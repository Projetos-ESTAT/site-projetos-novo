project:
  type: website
  output-dir: _site

lang: pt

website:
  title: "Projetos ESTAT"
  description: "Guia da Diretoria de Projetos da ESTAT: jornadas, guias e ferramentas para quem toca projeto."
  favicon: assets/img/logo-estat.svg
  site-url: https://projetos-estat.github.io/site-projetos-novo/
  repo-url: https://github.com/Projetos-ESTAT/site-projetos-novo
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    logo: assets/img/logo-estat.svg
    logo-alt: "Logo da ESTAT"
    title: "Projetos"
    left:
      - text: Jornadas
        menu:
          - href: jornadas/index.qmd
            text: Jornada do gerente
          - href: jornadas/alocado.qmd
            text: Jornada do alocado
          - href: jornadas/checklist.qmd
            text: Checklist do gerente
      - href: guias/comunicacao-cliente.qmd
        text: Comunicação
      - text: A Diretoria
        menu:
          - href: diretoria/historia.qmd
            text: História
          - href: sobre.qmd
            text: Sobre o site
  page-footer:
    left: "Diretoria de Projetos — ESTAT, empresa júnior de consultoria estatística da UnB"
    right:
      - icon: github
        href: https://github.com/Projetos-ESTAT
        aria-label: GitHub da Diretoria de Projetos

format:
  html:
    theme:
      dark: [cosmo, assets/estat.scss, assets/escuro.scss]
      light: [cosmo, assets/estat.scss, assets/claro.scss]
    toc: true
    toc-title: "Nesta página"
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    fig-cap-location: bottom

crossref:
  fig-title: Figura

editor: visual
