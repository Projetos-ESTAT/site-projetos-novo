        aria-label: GitHub da Diretoria de Projetos

format:
  html:
    theme:
      dark: [cosmo, assets/estat.scss, assets/escuro.scss]
      light: [cosmo, assets/estat.scss, assets/claro.scss]
    toc: true
    toc-title: "Nesta página"
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    fig-cap-location: bottom

crossref:
  fig-title: Figura

editor: visual
