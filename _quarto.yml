          - text: "---"
          - href: jornadas/relatorios.qmd
            text: Relatórios estatísticos
          - href: jornadas/dashboards.qmd
            text: Dashboards
          - href: jornadas/consultoria.qmd
            text: Consultoria
          - href: jornadas/modelos-preditivos.qmd
            text: Modelos preditivos
          - text: "---"
          - href: jornadas/alocado.qmd
            text: Jornada do alocado
      - text: Guias
        menu:
          - href: guias/comunicacao-cliente.qmd
            text: Comunicação com o cliente
          - href: guias/ferramentas.qmd
            text: Ferramentas do projeto
      - text: Ferramentas
        menu:
          - href: ferramentas/checklist.qmd
            text: Checklist do gerente
          - href: "https://nsd14o-gabriel-henrique.shinyapps.io/Controle-de-Atrasos/"
            text: Controle de atrasos
      - href: casos/index.qmd
